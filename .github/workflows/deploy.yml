name: Deploy para Cloudflare Pages

on:
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

# Evita dois deploys simultâneos sobrescrevendo um ao outro
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=portfolio-akin --branch=main
